  <script>
  (function(){
    'use strict';

    var payloadUrl = '/assets/documents/profile-payload.txt';
    var currentObjectUrl = null;
    var loading = document.getElementById('document-loading');
    var ready = document.getElementById('document-ready');
    var error = document.getElementById('document-error');
    var viewer = document.getElementById('document-viewer');
    var download = document.getElementById('document-download');
    var retry = document.getElementById('document-retry');

    function setState(state){
      loading.hidden = state !== 'loading';
      ready.hidden = state !== 'ready';
      error.hidden = state !== 'error';
      retry.hidden = state !== 'error';
      download.hidden = state !== 'ready';
      viewer.hidden = state !== 'ready';
    }

    function decodePayload(encoded){
      var normalized = encoded.replace(/\s/g, '');
      var binary = window.atob(normalized);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i += 1) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    function loadDocument(){
      setState('loading');

      fetch(payloadUrl, { cache: 'force-cache', credentials: 'same-origin' })
        .then(function(response){
          if (!response.ok) {
            throw new Error('Document payload request failed');
          }
          return response.text();
        })
        .then(function(encoded){
          var bytes = decodePayload(encoded);
          var blob = new Blob([bytes], { type: 'application/pdf' });

          if (currentObjectUrl) {
            URL.revokeObjectURL(currentObjectUrl);
          }

          currentObjectUrl = URL.createObjectURL(blob);
          viewer.src = currentObjectUrl + '#view=FitH';
          download.href = currentObjectUrl;
          setState('ready');
        })
        .catch(function(){
          setState('error');
        });
    }

    retry.addEventListener('click', loadDocument);
    window.addEventListener('pagehide', function(){
      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
      }
    }, { once: true });

    loadDocument();
  })();
  </script>
